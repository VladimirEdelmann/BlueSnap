; BlueSnap configuration (install.ps1 writes config.ini next to the executable).
; Changes take effect after restarting the agent (tray icon > Exit, then sign out/in, or re-run install.ps1).

; Bluetooth address of the speaker. Find it with:  bluesnap-cli list
DeviceAddress=12:34:56:78:9A:BC

; Make the speaker the default output (console + multimedia roles) once it connects,
; but only if Windows has not already done so.
SetAsDefault=true
; Also make it the default *communications* device (Teams/Zoom etc.).
SetAsDefaultCommunications=false

; Tray menu "Hand off to another device": disconnects the speaker and suspends auto-connect for
; this many minutes, so your phone can take it. "Connect now" ends the hand-off early.
HandOffMinutes=2

; Optional automatic pause after the speaker disconnects FROM THIS PC (e.g. you pressed its
; Bluetooth button while it was playing from the PC). 0 = reconnect immediately (default).
; Set e.g. 30 if you usually hand the speaker to your phone with its button instead of the tray menu.
HoldOffAfterDisconnectSec=0

; How long to wait for the audio connection after each connect request.
; A Bluetooth page attempt takes ~5 s when the speaker does not answer, so keep this >= 5.
AttemptTimeoutSec=6

; Pause between attempts while the speaker is unavailable.
; First FastPhaseMinutes after it became unavailable: FastGapSec, afterwards: SlowGapSec.
; Worst-case reaction time ~= AttemptTimeoutSec + gap  (defaults: ~8 s, after 1 hour ~26 s).
FastGapSec=2
FastPhaseMinutes=60
SlowGapSec=20

; While another Bluetooth audio device (e.g. headphones) is playing, use SlowGapSec so the
; speaker search does not cause dropouts on it.
SlowWhileOtherBtAudioActive=true

; Notification-area icon with Connect now / Hand off / Pause / Open log / Exit.
ShowTrayIcon=true

; Log every connect request (otherwise only state changes and periodic summaries).
VerboseLog=false
